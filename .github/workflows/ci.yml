name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      DATABASE_URL: postgresql+asyncpg://bagg:baggpassword@localhost:5433/bagg_dev
      SYNC_DATABASE_URL: postgresql+psycopg2://bagg:baggpassword@localhost:5433/bagg_dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bagg
          POSTGRES_PASSWORD: baggpassword
          POSTGRES_DB: bagg_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bagg -d bagg_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: |
          cd apps/api
          uv sync --extra dev

      - name: Run migrations
        run: |
          cd apps/api
          uv run alembic upgrade head

      - name: Run Pytest
        run: |
          cd apps/api
          uv run pytest

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build packages & web
        run: pnpm build
