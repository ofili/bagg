services:
  postgres:
    image: postgres:16-alpine
    container_name: bagg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bagg
      POSTGRES_PASSWORD: baggpassword
      POSTGRES_DB: bagg_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagg -d bagg_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bagg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local mocks (activate with: docker compose --profile mocks up -d)
  mailpit:
    image: axllent/mailpit:latest
    container_name: bagg-mailpit
    restart: unless-stopped
    profiles:
      - mocks
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: bagg-minio
    restart: unless-stopped
    profiles:
      - mocks
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
